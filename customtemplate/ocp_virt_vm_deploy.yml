---
# Self-Service Automation Portal (SSAP) custom template
# Import: https://github.com/MarouenMechtri/managing-VM-OCP-virt-AAP
#
# Aligns with the rhpds/ocp-virt Day-1 demo (RHEL9 on OpenShift Virtualization)
# but adds count + size survey and a monthly cost preview.
#
# AAP prerequisites:
#   1. Job template named exactly: Provision VMs
#   2. Playbook: playbooks/provision_vms.yml (this repo) OR replace
#      provision_vms.yml in your rhpds/ocp-virt project with that file
#   3. Job template extra_vars / survey must supply ssh_public_key and vm_password
#      (keep secrets in AAP credentials / survey, not in this Git repo)
#   4. Credential: OpenShift / kubeconfig for your cluster
#
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ocp-virt-vm-deploy-custom
  title: Deploy VMs on OpenShift Virtualization
  description: >-
    Provision RHEL 9 VMs on OpenShift Virtualization (linuxvm project).
    Choose how many VMs and which size (small / medium / large), preview
    the estimated monthly cost, then launch the AAP Provision VMs job.
  namespace: default
  tags:
    - openshift
    - virtualization
    - provisioning
    - cost
    - rhel
spec:
  type: service
  owner: group:default/platform-team
  presentation:
    buttonLabels:
      backButtonText: 'Back'
      createButtonText: 'Deploy VMs'
      reviewButtonText: 'Review & cost estimate'

  parameters:
    - title: VM configuration
      required:
        - vmRole
        - vmCount
        - vmSize
        - vmEnv
        - targetNamespace
      properties:
        vmRole:
          title: VM role / name prefix
          type: string
          description: >-
            Used in VM names as {role}-{env}-{id} (demo style), e.g. web-dev-01.
          pattern: '^[a-z]([a-z0-9-]{0,20}[a-z0-9])?$'
          default: web
          minLength: 2
          maxLength: 22
          errorMessage:
            pattern: 'Use a DNS-safe lowercase prefix.'

        vmCount:
          title: Number of VMs
          type: integer
          description: How many identical VMs to create (1–10 for the workshop cluster).
          default: 1
          minimum: 1
          maximum: 10
          errorMessage:
            minimum: 'At least 1 VM is required.'
            maximum: 'Maximum is 10 VMs per request.'

        vmSize:
          title: VM size
          type: string
          description: >-
            Matches OpenShift RHEL9 server templates used by the ocp-virt demo.
          default: small
          enum:
            - small
            - medium
            - large
          enumNames:
            - Small — 1 vCPU / 2 GiB / 30 GiB (rhel9-server-small)
            - Medium — 1 vCPU / 4 GiB / 30 GiB (rhel9-server-medium)
            - Large — 2 vCPU / 8 GiB / 30 GiB (rhel9-server-large)

        vmEnv:
          title: Environment
          type: string
          description: Environment segment in the VM name and chargeback label.
          default: dev
          enum:
            - dev
            - staging
            - prod
          enumNames:
            - Development
            - Staging
            - Production

        targetNamespace:
          title: OpenShift project / namespace
          type: string
          description: Namespace for VirtualMachine objects (demo default is linuxvm).
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          default: linuxvm
          errorMessage:
            pattern: 'Enter a valid OpenShift namespace name.'

        vmStartId:
          title: Starting VM id
          type: integer
          description: First numeric suffix (web-dev-01 if start id = 1).
          default: 1
          minimum: 1
          maximum: 99

        inventory:
          title: Target inventory
          description: AAP inventory that can reach the OpenShift API (often localhost + kube credential).
          resource: inventories
          ui:field: AAPResourcePicker

        credentials:
          title: Credentials
          description: >-
            OpenShift / kubeconfig credential for the cluster.
            SSH public key and VM password should remain on the job template survey.
          type: array
          ui:field: AAPResourcePicker
          resource: credentials

      dependencies:
        vmSize:
          oneOf:
            - properties:
                vmSize:
                  const: small
                sizeSummary:
                  type: string
                  title: Selected size — Small
                  description: >-
                    Specs: 1 vCPU · 2 GiB RAM · 30 GiB disk (rhel9-server-small).
                    Base rate: 25 000 XOF / VM / month.
                  default: '1 vCPU | 2 GiB | 30 GiB | 25 000 XOF/VM/mo'
                  ui:widget: textarea
                  ui:readonly: true
                  ui:options:
                    rows: 2
                  ui:backstage:
                    review:
                      show: true
            - properties:
                vmSize:
                  const: medium
                sizeSummary:
                  type: string
                  title: Selected size — Medium
                  description: >-
                    Specs: 1 vCPU · 4 GiB RAM · 30 GiB disk (rhel9-server-medium).
                    Base rate: 45 000 XOF / VM / month.
                  default: '1 vCPU | 4 GiB | 30 GiB | 45 000 XOF/VM/mo'
                  ui:widget: textarea
                  ui:readonly: true
                  ui:options:
                    rows: 2
            - properties:
                vmSize:
                  const: large
                sizeSummary:
                  type: string
                  title: Selected size — Large
                  description: >-
                    Specs: 2 vCPU · 8 GiB RAM · 30 GiB disk (rhel9-server-large).
                    Base rate: 85 000 XOF / VM / month.
                  default: '2 vCPU | 8 GiB | 30 GiB | 85 000 XOF/VM/mo'
                  ui:widget: textarea
                  ui:readonly: true
                  ui:options:
                    rows: 2

    - title: Cost estimate & confirmation
      required:
        - acceptCostEstimate
      properties:
        pricingGuide:
          type: string
          title: How the estimate is calculated
          description: >-
            Estimated monthly cost = unit rate for size × number of VMs.
            Rates: small 25 000 · medium 45 000 · large 85 000 XOF per VM/month.
          default: 'small 25 000 | medium 45 000 | large 85 000 XOF per VM/month'
          ui:widget: textarea
          ui:readonly: true
          ui:options:
            rows: 2
          ui:backstage:
            review:
              show: true

        acceptCostEstimate:
          title: I understand and accept the estimated monthly charge
          type: boolean
          description: >-
            Confirm you reviewed the size rate and VM count.
            The computed total appears on Review and in the job output.
          default: false
          const: true
          errorMessage:
            const: 'You must accept the cost estimate to continue.'

        businessJustification:
          title: Business justification (optional)
          type: string
          description: Short note for chargeback / audit.
          ui:options:
            rows: 3

    - title: Ready to deploy
      properties:
        finalNote:
          type: string
          title: Next step
          description: >-
            Click Review & cost estimate, verify the monthly total, then Deploy VMs.
            The job uses your AAP kube credential against OpenShift Virtualization.
          default: 'ssh_public_key and vm_password must already be set on the Provision VMs job template.'
          ui:widget: textarea
          ui:readonly: true
          ui:options:
            rows: 2

  steps:
    - id: cost-preview
      name: Preview monthly cost
      action: debug:log
      input:
        message: |
          === OpenShift Virtualization — cost estimate ===
          Names:        ${{ parameters.vmRole }}-${{ parameters.vmEnv }}-NN × ${{ parameters.vmCount }}
          Size:         ${{ parameters.vmSize }} (${{ parameters.sizeSummary }})
          Namespace:    ${{ parameters.targetNamespace }}
          Environment:  ${{ parameters.vmEnv }}
          Unit (XOF):   ${{ parameters.vmSize === 'small' ? 25000 : (parameters.vmSize === 'medium' ? 45000 : 85000) }}
          Estimated TOTAL / month (XOF): ${{ (parameters.vmSize === 'small' ? 25000 : (parameters.vmSize === 'medium' ? 45000 : 85000)) * parameters.vmCount }}
          ================================================

    - id: launch-job
      name: Provision VMs on OpenShift Virtualization
      action: rhaap:launch-job-template
      input:
        token: ${{ secrets.aapToken }}
        values:
          # Must match the AAP job template name exactly
          template: Provision VMs
          inventory: ${{ parameters.inventory }}
          credentials: ${{ parameters.credentials }}
          extraVariables:
            vm_role: ${{ parameters.vmRole }}
            vm_count: ${{ parameters.vmCount }}
            vm_size: ${{ parameters.vmSize }}
            vm_env: ${{ parameters.vmEnv }}
            vm_start_id: ${{ parameters.vmStartId }}
            target_namespace: ${{ parameters.targetNamespace }}
            business_justification: ${{ parameters.businessJustification }}
            currency: XOF
            # Quote expressions that contain ":" so YAML does not treat them as nested maps
            unit_price_xof: "${{ parameters.vmSize === 'small' ? 25000 : (parameters.vmSize === 'medium' ? 45000 : 85000) }}"
            estimated_monthly_cost_xof: "${{ (parameters.vmSize === 'small' ? 25000 : (parameters.vmSize === 'medium' ? 45000 : 85000)) * parameters.vmCount }}"

  output:
    text:
      - title: VM deployment submitted
        content: |
          **Job ID:** ${{ steps['launch-job'].output.data.id }}
          **Status:** ${{ steps['launch-job'].output.data.status }}

          [View job in Ansible Automation Platform](${{ steps['launch-job'].output.data.url }})

          ---
          **Request summary**
          - VMs: ${{ parameters.vmCount }} × `${{ parameters.vmSize }}` → `${{ parameters.vmRole }}-${{ parameters.vmEnv }}-*`
          - Namespace: `${{ parameters.targetNamespace }}`
          - Estimated monthly cost: **${{ (parameters.vmSize === 'small' ? 25000 : (parameters.vmSize === 'medium' ? 45000 : 85000)) * parameters.vmCount }} XOF**

          Open the cluster console to watch VMs come up in the **linuxvm** project.
    links:
      - title: OpenShift Virtualization docs
        url: https://docs.openshift.com/container-platform/latest/virt/about_virt/about-virt.html
      - title: Demo playbook source (rhpds/ocp-virt)
        url: https://github.com/rhpds/ocp-virt/blob/main/provision_vms.yml
