---
# Self-Service Automation Portal template
# Import SCM: https://github.com/MarouenMechtri/managing-VM-OCP-virt-AAP
#
# Launches AAP job template: Provision VM on OCP Virtualization
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ocp-virt-vm-deploy-custom
  title: Deploy VM on OpenShift Virtualization
  description: >-
    Provision a VM in your user project (user-<username>). Creates the
    namespace and admin binding if missing. Sizes S/M/L/XL map to Cost Management.
  namespace: default
  tags:
    - openshift
    - virtualization
    - provisioning
    - cost
spec:
  type: service
  owner: group:default/platform-team
  presentation:
    buttonLabels:
      createButtonText: Provision VM
      reviewButtonText: Review

  parameters:
    - title: VM request
      required:
        - username
        - vmName
        - vmSize
      properties:
        username:
          title: OpenShift username
          type: string
          description: Project user-<username> is created if it does not exist.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          default: user1

        vmName:
          title: VM name
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          default: vm-demo

        vmSize:
          title: Size (Cost Management instance-type)
          type: string
          default: S
          enum: [S, M, L, XL]
          enumNames:
            - S — u1.small — $29.99/mo
            - M — u1.medium — $59.99/mo
            - L — u1.large — $119.99/mo
            - XL — u1.xlarge — $239.99/mo

        vmOs:
          title: OS image (DataSource)
          type: string
          default: fedora
          enum: [fedora, rhel9, rhel10, centos-stream9]

        inventory:
          title: AAP inventory
          resource: inventories
          ui:field: AAPResourcePicker

        credentials:
          title: OpenShift credentials
          type: array
          ui:field: AAPResourcePicker
          resource: credentials

  steps:
    - id: launch
      name: Launch Provision VM job
      action: rhaap:launch-job-template
      input:
        template: Provision VM on OCP Virtualization
        inventory: ${{ parameters.inventory }}
        credentials: ${{ parameters.credentials }}
        extraVars:
          username: ${{ parameters.username }}
          vm_name: ${{ parameters.vmName }}
          vm_size: ${{ parameters.vmSize }}
          vm_os: ${{ parameters.vmOs }}

  output:
    links:
      - title: AAP job
        url: ${{ steps.launch.output.data.url }}
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ocp-virt-vm-cost-custom
  title: Show VM deployment cost
  description: >-
    Query Cost Management for project user-<username> (instance-type chargeback).
  namespace: default
  tags:
    - openshift
    - cost
    - virtualization
spec:
  type: service
  owner: group:default/platform-team
  parameters:
    - title: Cost report
      required:
        - username
        - costUsername
        - costPassword
      properties:
        username:
          title: OpenShift username
          type: string
          default: user1
        costUsername:
          title: Cost Management SSO username
          type: string
          default: user1
        costPassword:
          title: Cost Management SSO password
          type: string
          ui:widget: password
        inventory:
          title: AAP inventory
          resource: inventories
          ui:field: AAPResourcePicker
        credentials:
          title: OpenShift credentials
          type: array
          ui:field: AAPResourcePicker
          resource: credentials

  steps:
    - id: launch
      name: Launch cost report job
      action: rhaap:launch-job-template
      input:
        template: Show VM deployment cost
        inventory: ${{ parameters.inventory }}
        credentials: ${{ parameters.credentials }}
        extraVars:
          username: ${{ parameters.username }}
          cost_username: ${{ parameters.costUsername }}
          cost_password: ${{ parameters.costPassword }}

  output:
    links:
      - title: AAP job
        url: ${{ steps.launch.output.data.url }}
