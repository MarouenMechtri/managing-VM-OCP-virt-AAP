---
# Self-Service Automation Portal templates for sandbox5308
# Import in portal: Templates → Add → GitHub URL → this file (or catalog-info.yaml)
#
# AAP job templates (org sandbox5308):
#   - Provision VM on OCP Virtualization (sandbox5308)
#   - Show deployment cost (sandbox5308)
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ocp-virt-vm-deploy-sandbox5308
  title: Deploy VM on OpenShift Virtualization (sandbox5308)
  description: >-
    Provision a VM in your user project (user-<username>) on sandbox5308.
    Creates the namespace and admin binding if missing. Sizes S/M/L/XL map to Cost Management.
  namespace: default
  tags:
    - openshift
    - virtualization
    - provisioning
    - cost
    - sandbox5308
spec:
  type: service
  owner: group:default/platform-team
  presentation:
    buttonLabels:
      createButtonText: Provision VM
      reviewButtonText: Review

  parameters:
    - title: VM request
      required:
        - username
        - vmSize
      properties:
        username:
          title: OpenShift username
          type: string
          description: Project user-<username> is created if it does not exist.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          default: user1

        vmName:
          title: VM name (optional)
          type: string
          description: Leave empty to use vm-<size> (e.g. vm-s).
          pattern: '^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          default: ""

        vmSize:
          title: Size (Cost Management instance-type)
          type: string
          default: S
          enum: [S, M, L, XL]
          enumNames:
            - S — u1.small — $29.99/mo
            - M — u1.medium — $59.99/mo
            - L — u1.large — $119.99/mo
            - XL — u1.xlarge — $239.99/mo

        vmOs:
          title: OS image (DataSource)
          type: string
          default: fedora
          enum: [fedora, rhel9, rhel10, centos-stream9]

        inventory:
          title: AAP inventory
          resource: inventories
          ui:field: AAPResourcePicker

        credentials:
          title: OpenShift credentials
          type: array
          ui:field: AAPResourcePicker
          resource: credentials
          description: Select "sandbox5308 OpenShift"

  steps:
    - id: launch
      name: Launch Provision VM job
      action: rhaap:launch-job-template
      input:
        template: Provision VM on OCP Virtualization (sandbox5308)
        inventory: ${{ parameters.inventory }}
        credentials: ${{ parameters.credentials }}
        extraVars:
          username: ${{ parameters.username }}
          vm_name: ${{ parameters.vmName }}
          vm_size: ${{ parameters.vmSize }}
          vm_os: ${{ parameters.vmOs }}

  output:
    links:
      - title: AAP job
        url: ${{ steps.launch.output.data.url }}
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ocp-virt-vm-cost-sandbox5308
  title: Show VM deployment cost (sandbox5308)
  description: >-
    Query Cost Management on sandbox5308 for project user-<username>
    (instance-type chargeback S/M/L/XL).
  namespace: default
  tags:
    - openshift
    - cost
    - virtualization
    - sandbox5308
spec:
  type: service
  owner: group:default/platform-team
  presentation:
    buttonLabels:
      createButtonText: Show cost
      reviewButtonText: Review

  parameters:
    - title: Cost report
      required:
        - username
      properties:
        username:
          title: OpenShift username
          type: string
          default: user1
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

        timeScopeUnits:
          title: Time scope
          type: string
          default: month
          enum: [month, day]

        inventory:
          title: AAP inventory
          resource: inventories
          ui:field: AAPResourcePicker
          description: Select "sandbox5308 localhost"

        credentials:
          title: Credentials
          type: array
          ui:field: AAPResourcePicker
          resource: credentials
          description: Select "sandbox5308 OpenShift" and "sandbox5308 Cost Management"

  steps:
    - id: launch
      name: Launch cost report job
      action: rhaap:launch-job-template
      input:
        template: Show deployment cost (sandbox5308)
        inventory: ${{ parameters.inventory }}
        credentials: ${{ parameters.credentials }}
        extraVars:
          username: ${{ parameters.username }}
          time_scope_units: ${{ parameters.timeScopeUnits }}

  output:
    links:
      - title: AAP job
        url: ${{ steps.launch.output.data.url }}
