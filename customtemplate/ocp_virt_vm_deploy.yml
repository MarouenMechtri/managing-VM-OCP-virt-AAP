---
# Self-Service Automation Portal templates for sandbox5308
# Import URL:
#   https://github.com/MarouenMechtri/managing-VM-OCP-virt-AAP/blob/sandbox5308/customtemplate/ocp_virt_vm_deploy.yml
#
# Inventory and credentials are fixed on the AAP job templates — not prompted here.
# Action schema (this portal build):
#   token: ${{ parameters.token }}
#   values: { template, extraVariables, ... }
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ocp-virt-vm-deploy-sandbox5308
  title: Deploy VM on OpenShift Virtualization (sandbox5308)
  description: >-
    Provision a VM in your user project (user-<username>) on sandbox5308.
    Creates the namespace and admin binding if missing. Sizes S/M/L/XL map to Cost Management.
  namespace: default
  tags:
    - openshift
    - virtualization
    - provisioning
    - cost
    - sandbox5308
spec:
  type: service
  owner: group:default/platform-team
  presentation:
    buttonLabels:
      createButtonText: Provision VM
      reviewButtonText: Review

  parameters:
    - title: VM request
      required:
        - username
        - vmSize
      properties:
        username:
          title: OpenShift username
          type: string
          description: Project user-<username> is created if it does not exist.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          default: user1

        vmName:
          title: VM name (optional)
          type: string
          description: Leave empty to use vm-<size> (e.g. vm-s).
          default: ""

        vmSize:
          title: Size (Cost Management instance-type)
          type: string
          default: S
          enum: [S, M, L, XL]
          enumNames:
            - S — u1.small — $29.99/mo
            - M — u1.medium — $59.99/mo
            - L — u1.large — $119.99/mo
            - XL — u1.xlarge — $239.99/mo

        vmOs:
          title: OS image (DataSource)
          type: string
          default: fedora
          enum: [fedora, rhel9, rhel10, centos-stream9]

        token:
          title: AAP Authentication Token
          type: string
          description: OAuth2 token (injected by the portal)
          ui:field: AAPTokenField
          ui:widget: hidden
          ui:backstage:
            review:
              show: false

  steps:
    - id: launch
      name: Launch Provision VM job
      action: rhaap:launch-job-template
      input:
        token: ${{ parameters.token }}
        values:
          template: Provision VM on OCP Virtualization (sandbox5308)
          extraVariables:
            username: ${{ parameters.username }}
            vm_name: ${{ parameters.vmName }}
            vm_size: ${{ parameters.vmSize }}
            vm_os: ${{ parameters.vmOs }}

  output:
    links:
      - title: AAP job
        url: ${{ steps.launch.output.data.url }}
---
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: ocp-virt-vm-cost-sandbox5308
  title: Show VM deployment cost (sandbox5308)
  description: >-
    Query Cost Management on sandbox5308 for project user-<username>
    (instance-type chargeback S/M/L/XL).
  namespace: default
  tags:
    - openshift
    - cost
    - virtualization
    - sandbox5308
spec:
  type: service
  owner: group:default/platform-team
  presentation:
    buttonLabels:
      createButtonText: Show cost
      reviewButtonText: Review

  parameters:
    - title: Cost report
      required:
        - username
      properties:
        username:
          title: OpenShift username
          type: string
          default: user1
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'

        timeScopeUnits:
          title: Time scope
          type: string
          default: month
          enum: [month, day]

        token:
          title: AAP Authentication Token
          type: string
          description: OAuth2 token (injected by the portal)
          ui:field: AAPTokenField
          ui:widget: hidden
          ui:backstage:
            review:
              show: false

  steps:
    - id: launch
      name: Launch cost report job
      action: rhaap:launch-job-template
      input:
        token: ${{ parameters.token }}
        values:
          template: Show deployment cost (sandbox5308)
          extraVariables:
            username: ${{ parameters.username }}
            time_scope_units: ${{ parameters.timeScopeUnits }}

  output:
    links:
      - title: AAP job
        url: ${{ steps.launch.output.data.url }}
