---
# Example playbook for AAP job template: "OpenShift Virt / Deploy VMs"
# Wire this (or your real kubevirt/ocp-virt role) to the job template
# referenced by customtemplate/ocp_virt_vm_deploy.yml
#
# Extra vars expected from SSAP (see template extraVariables):
#   vm_name_prefix, vm_count, vm_size, vm_vcpu, vm_memory_gi, vm_os_disk_gi,
#   vm_data_disk_gi, operating_system, target_namespace, environment,
#   unit_price_xof, disk_price_per_gi_xof, env_multiplier,
#   estimated_monthly_cost_xof, currency, business_justification
- name: Deploy VMs on OpenShift Virtualization
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vm_name_prefix: "{{ vm_name_prefix | default('vm') }}"
    vm_count: "{{ vm_count | default(1) | int }}"
    vm_size: "{{ vm_size | default('medium') }}"
    vm_vcpu: "{{ vm_vcpu | default(4) | int }}"
    vm_memory_gi: "{{ vm_memory_gi | default(8) | int }}"
    vm_os_disk_gi: "{{ vm_os_disk_gi | default(80) | int }}"
    vm_data_disk_gi: "{{ vm_data_disk_gi | default(0) | int }}"
    operating_system: "{{ operating_system | default('rhel9') }}"
    target_namespace: "{{ target_namespace | default('vm-workloads') }}"
    environment: "{{ environment | default('development') }}"
    currency: "{{ currency | default('XOF') }}"
    estimated_monthly_cost_xof: "{{ estimated_monthly_cost_xof | default(0) }}"

  tasks:
    - name: Show cost estimate for chargeback
      ansible.builtin.debug:
        msg: |
          Chargeback preview
          ------------------
          {{ vm_count }} × {{ vm_size }} ({{ vm_vcpu }} vCPU / {{ vm_memory_gi }} GiB)
          Namespace: {{ target_namespace }}
          Environment: {{ environment }}
          Estimated monthly cost: {{ estimated_monthly_cost_xof }} {{ currency }}

    - name: Build VM name list
      ansible.builtin.set_fact:
        vm_names: "{{ vm_names | default([]) + [vm_name_prefix ~ '-' ~ ('%03d' | format(item))] }}"
      loop: "{{ range(1, (vm_count | int) + 1) | list }}"

    # Replace this block with your real OpenShift Virtualization automation,
    # e.g. kubernetes.kubevirt.kubevirt_vm, kubernetes.core.k8s, or a custom role.
    - name: Placeholder — create VirtualMachine manifests
      ansible.builtin.debug:
        msg: >-
          Would create VM {{ item }} in {{ target_namespace }}
          with {{ vm_vcpu }} vCPU, {{ vm_memory_gi }}Gi memory,
          OS disk {{ vm_os_disk_gi }}Gi, data disk {{ vm_data_disk_gi }}Gi,
          image={{ operating_system }}
      loop: "{{ vm_names }}"
      loop_control:
        label: "{{ item }}"
